<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudy Launcher</title>
  <!-- CLOUDY_CSS -->
</head>
<body>
  <div class="cloudy-app">
    <header class="topbar">
      <div class="brand-lockup">
        <img class="brand-mark" src="CLOUDY_ICON_DATA" width="25" height="25" alt="Cloudy Launcher">
        <span class="brand-name">Cloudy Launcher</span>
        <span class="crumb-separator">/</span>
        <span class="crumb" id="crumb">Home</span>
      </div>
      <div class="topbar-status" aria-live="polite"><span class="status-dot"></span><span id="topbar-running-text">No instances are currently running</span></div>
      <button class="profile-pill" data-action="accounts" aria-label="Open accounts">
        <span class="profile-avatar" id="profile-avatar"><span id="profile-avatar-letter">C</span><img id="profile-avatar-image" alt=""></span>
        <span class="profile-copy"><strong id="profile-name">No account</strong><small id="profile-subtitle">Minecraft account</small></span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="window-controls" role="group" aria-label="Window controls">
        <button class="window-control" data-action="window-minimize" aria-label="Minimize Cloudy Launcher" title="Minimize">−</button>
        <button class="window-control" data-action="window-toggle-maximize" aria-label="Maximize Cloudy Launcher" title="Maximize">□</button>
        <button class="window-control window-control-close" data-action="window-close" aria-label="Close Cloudy Launcher" title="Close">×</button>
      </div>
    </header>

    <aside class="rail" aria-label="Cloudy navigation">
      <div class="rail-main">
        <button class="rail-button is-active" data-route="home" title="Library" aria-label="Library"><span class="icon icon-home"></span></button>
        <button class="rail-button" data-route="new" title="Create instance" aria-label="Create instance"><span class="icon icon-plus"></span></button>
        <button class="rail-button" data-route="settings" title="Settings" aria-label="Settings"><span class="icon icon-sliders"></span></button>
        <button class="rail-button" data-route="skins" title="Skin Studio" aria-label="Skin Studio"><span class="icon icon-skin"></span></button>
      </div>
      <span class="rail-spacer"></span>
      <div class="rail-bottom">
        <span class="rail-bottom-rule" aria-hidden="true"></span>
        <button class="rail-button rail-account-button" data-route="accounts" title="Accounts" aria-label="Accounts"><span class="icon icon-person"></span></button>
      </div>
    </aside>

    <main class="workspace" id="workspace" aria-live="polite"></main>
    <div class="weather-scene" aria-hidden="true"><div class="scene-sky"></div><div class="scene-sun"></div><div class="scene-clouds"></div><div class="scene-mountains"></div><div class="scene-trees"></div><div class="scene-fog"></div><div class="scene-puddles"></div><div class="scene-rain"></div><div class="scene-stars"></div><div class="scene-snow"></div><div class="scene-leaves"></div><div class="scene-ice"></div></div>
    <div class="ambient-cloud cloud-one" aria-hidden="true"><img class="ambient-art" src="data:image/png;base64,CLOUDY_CLOUD_ART" alt=""></div>
    <div class="ambient-cloud cloud-two" aria-hidden="true"><img class="ambient-art" src="data:image/png;base64,CLOUDY_CLOUD_ART" alt=""></div>
    <div class="particle-field" aria-hidden="true"><i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i><i class="particle p4"></i><i class="particle p5"></i><i class="particle p6"></i></div>
  </div>
  <!-- CLOUDY_WEBCHANNEL_JS -->
  <!-- CLOUDY_APP_JS -->
</body>
</html>
